plugins {
    id('com.android.application')
    id('dev.rikka.tools.refine')
    id('org.jetbrains.kotlin.android')
}

// 签名配置从 key.properties 读取（不提交、不入库），缺省时 release 构建不签名
// 生成密钥: keytool -genkeypair -v -keystore ~/.android/personal.keystore -alias personal \
//           -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=..., O=..., C=CN"
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('key.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.lubui.shellbox'
    defaultConfig {
        applicationId "com.lubui.shellbox"
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    signingConfigs {
        sign {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // debug 也开 R8 裁剪（只 shrink 不混淆，堆栈可读），否则整个 Kotlin stdlib 会被打进去
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.sign
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'

    // Shizuku & Sui API (from Maven Central, self-contained)
    implementation 'dev.rikka.shizuku:api:13.1.5'       // required by Shizuku and Sui
    implementation 'dev.rikka.shizuku:provider:13.1.5'  // required by Shizuku only

    // Official generic hidden API stubs (compile-time only, not packaged)
    // https://github.com/RikkaApps/Shizuku-API/blob/master/hidden-api-stub
    compileOnly 'dev.rikka.hidden:stub:4.4.0'

    // bypass hidden api restriction, https://github.com/LSPosed/AndroidHiddenApiBypass
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // 服务端推送（ntfy 订阅）：HTTP 客户端（长轮询 + 发布），项目唯一第三方网络库
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
