plugins {
    id('com.android.application')
    id('dev.rikka.tools.refine')
}

android {
    namespace 'rikka.shizuku.demo'
    defaultConfig {
        applicationId "rikka.shizuku.demo"
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                abiFilters "armeabi-v7a", 'arm64-v8a', 'x86', 'x86_64'
                cppFlags "-std=c++17"
                arguments '-DANDROID_TOOLCHAIN=clang', '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        aidl true
    }
    signingConfigs {
        sign
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.3.0'

    // Shizuku & Sui API (from Maven Central, self-contained)
    implementation 'dev.rikka.shizuku:api:13.1.5'       // required by Shizuku and Sui
    implementation 'dev.rikka.shizuku:provider:13.1.5'  // required by Shizuku only

    // Official generic hidden API stubs (compile-time only, not packaged)
    // https://github.com/RikkaApps/Shizuku-API/blob/master/hidden-api-stub
    compileOnly 'dev.rikka.hidden:stub:4.4.0'

    // bypass hidden api restriction, https://github.com/LSPosed/AndroidHiddenApiBypass
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
